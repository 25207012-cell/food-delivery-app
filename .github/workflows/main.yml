name: Food Delivery CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-package-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python -m py_compile app.py

      - name: Test
        run: python -m pytest

      - name: Package
        run: |
          mkdir package
          cp app.py README.md requirements.txt package/
          zip -r food-delivery-app.zip package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: food-delivery-app
          path: food-delivery-app.zip

      - name: Deploy
        run: |
          echo "Deploying Food Delivery Application..."
          echo "Application deployment completed successfully."
